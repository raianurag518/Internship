<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | UniPass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">
  <div class="w-full max-w-lg space-y-6">
    <div class="text-center space-y-2">
      <a href="/" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-400 hover:text-white mb-2 transition">
        <i class="fa-solid fa-arrow-left"></i><span>Back to Home</span>
      </a>
      <div class="w-14 h-14 rounded-2xl bg-indigo-600 flex items-center justify-center text-white mx-auto shadow-xl shadow-indigo-600/30">
        <i class="fa-solid fa-user-plus text-2xl"></i>
      </div>
      <h1 class="text-3xl font-black text-white">Create College Profile</h1>
      <p class="text-xs text-slate-400">Join with your college details to unlock primary & P2P ticket passes</p>
    </div>

    <div class="p-6 sm:p-8 rounded-3xl bg-slate-900 border border-slate-800 space-y-4 shadow-2xl">
      <form onsubmit="handleRegister(event)" class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-300 uppercase mb-1">Full Name</label>
            <input type="text" id="reg-name" required placeholder="Anurag Rai" class="w-full bg-slate-950 border border-slate-700 rounded-xl py-2 px-3 text-white focus:border-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block font-bold text-slate-300 uppercase mb-1">Phone Number (Numbers Only)</label>
            <input type="tel" inputmode="numeric" pattern="[0-9]*" id="reg-phone" required placeholder="9723890793" maxlength="15" oninput="this.value = this.value.replace(/\D/g, '').slice(0, 15)" class="w-full bg-slate-950 border border-slate-700 rounded-xl py-2 px-3 text-white font-mono focus:border-indigo-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-300 uppercase mb-1">College / University Name</label>
          <input type="text" id="reg-college" required placeholder="Indian Institute of Technology Delhi (IIT Delhi)" class="w-full bg-slate-950 border border-slate-700 rounded-xl py-2 px-3 text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-300 uppercase mb-1">Department / Degree</label>
            <input type="text" id="reg-dept" required placeholder="B.Tech Computer Science & Engineering" class="w-full bg-slate-950 border border-slate-700 rounded-xl py-2 px-3 text-white focus:border-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block font-bold text-slate-300 uppercase mb-1">Roll No / Student ID (Numbers Only)</label>
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="reg-roll" required placeholder="202310842" maxlength="15" oninput="this.value = this.value.replace(/\D/g, '').slice(0, 15)" class="w-full bg-slate-950 border border-slate-700 rounded-xl py-2 px-3 text-white font-mono focus:border-indigo-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-300 uppercase mb-1">Email Address</label>
          <input type="email" id="reg-email" required placeholder="raianurag518@gmail.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl py-2 px-3 text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block font-bold text-slate-300 uppercase mb-1">Password</label>
          <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" value="Student@1234" class="w-full bg-slate-950 border border-slate-700 rounded-xl py-2 px-3 text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-lg shadow-indigo-600/30 transition">
          Create Account & Access Profile
        </button>
      </form>

      <div class="text-center text-xs text-slate-400">
        <span>Already have an account? </span>
        <a href="/login/" class="text-indigo-400 font-bold hover:underline">Sign In</a>
      </div>
    </div>
  </div>

  <script>
    function handleRegister(e) {
      e.preventDefault();
      const user = {
        name: document.getElementById('reg-name').value.trim() || 'Anurag Rai',
        phone: document.getElementById('reg-phone').value.replace(/\D/g, '').slice(0, 15) || '9723890793',
        college: document.getElementById('reg-college').value.trim() || 'Indian Institute of Technology Delhi (IIT Delhi)',
        dept: document.getElementById('reg-dept').value.trim() || 'B.Tech Computer Science & Engineering',
        roll: document.getElementById('reg-roll').value.replace(/\D/g, '').slice(0, 15) || '202310842',
        email: document.getElementById('reg-email').value.trim() || 'raianurag518@gmail.com',
        batch: 'Class of 2027',
        location: 'Hauz Khas, New Delhi',
        role: 'STUDENT',
        trustRating: '0.0'
      };
      localStorage.setItem('campus_session', 'true');
      localStorage.setItem('campus_user', JSON.stringify(user));
      alert('College Account created successfully! Redirecting to Home...');
      window.location.href = '/';
    }
  </script>
</body>
</html>

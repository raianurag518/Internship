<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | UniPass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- Firebase App & Firestore SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAz_j1ae3xaDtR-uivH4aGNqJOBD8qw9Ho",
      authDomain: "studio-37370994-798b7.firebaseapp.com",
      projectId: "studio-37370994-798b7",
      storageBucket: "studio-37370994-798b7.firebasestorage.app",
      messagingSenderId: "497126823684",
      appId: "1:497126823684:web:fbd3f71d973a233fab2251"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.saveSigninToDatabase = async function(user) {
      try {
        // 1. Update / create document in Firestore 'users' collection
        await setDoc(doc(db, "users", user.email), {
          name: user.name,
          email: user.email,
          phone: user.phone || "",
          college: user.college || "",
          dept: user.dept || "",
          roll: user.roll || "",
          role: user.role,
          lastLoginAt: new Date().toISOString(),
          status: "ONLINE"
        }, { merge: true });

        // 2. Add an audit log record into Firestore 'signins' collection
        await addDoc(collection(db, "signins"), {
          name: user.name,
          email: user.email,
          role: user.role,
          college: user.college || "",
          timestamp: new Date().toISOString(),
          loginType: "DIRECT_SIGNIN"
        });
        console.log("Recorded sign-in in Cloud Firestore for:", user.email);
      } catch (err) {
        console.error("Firestore signin write error:", err);
      }
    };
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">
  <div class="w-full max-w-md space-y-6">
    <div class="text-center space-y-2">
      <a href="/" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-400 hover:text-white mb-2 transition">
        <i class="fa-solid fa-arrow-left"></i><span>Back to Home</span>
      </a>
      <div class="w-14 h-14 rounded-2xl bg-indigo-600 flex items-center justify-center text-white mx-auto shadow-xl shadow-indigo-600/30">
        <i class="fa-solid fa-ticket-simple text-2xl"></i>
      </div>
      <h1 class="text-3xl font-black text-white">Sign In to UniPass</h1>
      <p class="text-xs text-slate-400">Enter your college credentials to access your account</p>
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-950/80 border border-emerald-500/40 text-emerald-300 text-[10px] font-mono font-bold">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span>Connected to Cloud Firestore Database</span>
      </div>
    </div>

    <div class="p-6 sm:p-8 rounded-3xl bg-slate-900 border border-slate-800 space-y-6 shadow-2xl">
      
      <!-- Manual Form -->
      <form onsubmit="handleManualLogin(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">College Email (.edu / .ac.in / Gmail)</label>
          <input type="email" id="email" required placeholder="student@college.edu" class="w-full bg-slate-950 border border-slate-700 rounded-xl py-2.5 px-4 text-xs text-white focus:border-indigo-500 focus:outline-none">
        </div>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-bold text-slate-300 uppercase">Password</label>
            <a href="/forgot-password/" class="text-[11px] text-indigo-400 hover:underline">Forgot?</a>
          </div>
          <div class="relative">
            <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl py-2.5 pl-4 pr-10 text-xs text-white focus:border-indigo-500 focus:outline-none">
            <button type="button" onclick="toggleLoginPassword()" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-200 transition focus:outline-none" aria-label="Toggle password visibility">
              <i id="login-eye-icon" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" id="btn-submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-lg shadow-indigo-600/30 transition">
          Sign In & Sync with Database
        </button>
      </form>

      <div class="text-center text-xs text-slate-400">
        <span>Don't have an account? </span>
        <a href="/register/" class="text-indigo-400 font-bold hover:underline">Create Account</a>
      </div>
    </div>
  </div>

  <script>
    function toggleLoginPassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('login-eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    async function handleManualLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const user = {
        name: 'Anurag Rai',
        email: email || 'raianurag518@gmail.com',
        phone: '9723890793',
        roll: '202310842',
        college: 'Indian Institute of Technology Delhi (IIT Delhi)',
        dept: 'B.Tech Computer Science & Engineering',
        batch: 'Class of 2027',
        location: 'Hauz Khas, New Delhi',
        role: 'STUDENT',
        trustRating: '0.0'
      };
      localStorage.setItem('campus_session', 'true');
      localStorage.setItem('campus_user', JSON.stringify(user));

      // Record sign in into Cloud Firestore
      if (window.saveSigninToDatabase) {
        await window.saveSigninToDatabase(user);
      }

      alert('Welcome back, ' + user.name + '! Login recorded in Cloud Firestore database.');
      window.location.href = '/';
    }
  </script>
</body>
</html>
